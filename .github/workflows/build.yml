# Builds every platform in the tool image (docker/Dockerfile), runs the
# tests, and packs bin/ into archives. Runs for a vX.Y.Z tag, which also
# publishes a GitHub release with the archives, and on demand from the
# Actions tab ("Run workflow"), which only uploads them as an artifact.
#
# MIT License (see: LICENSE)
# Copyright (C) 2026 Tomaz Stih

name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # FreeInk, littlefs, FatFs and PlatformIO's platform and toolchain,
      # so a run downloads them only when their pins change.
      - name: Restore packages
        uses: actions/cache@v4
        with:
          path: packages
          key: packages-${{ hashFiles('tools/download_sdk.py', 'tools/download_filesystems.py', 'platformio.ini') }}

      - name: Build and test
        run: make ci VERSION=${{ steps.version.outputs.version }}

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: inkerface-${{ steps.version.outputs.version }}
          path: build/archives/*.tar.gz
          if-no-files-found: error

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/archives/*.tar.gz \
            --title "inkerface $GITHUB_REF_NAME" --generate-notes
