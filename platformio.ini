; Device build of inkerface for the Xteink X4 (ESP32-C3, SSD1677).
;
; FreeInk is linked from the packages/freeink-sdk download cache through
; symlink lib_deps, exactly as the SDK's platformio.sample.ini recommends.
; PlatformIO's own platforms, toolchains and library downloads live in
; packages/ too (core_dir, libdeps_dir), so `make clean` keeps them and
; nothing is installed into the home directory. Run it through `make`,
; which uses the tool image in docker/. The
; base platform and flags mirror that sample (verified by FreeInk).
; Our platform library (lib/inkerface) is picked up from lib_dir; its
; library.json excludes the host backend. The host build uses CMake.
;
; MIT License (see: LICENSE)
; Copyright (C) 2026 Tomaz Stih

[platformio]
default_envs = x4
src_dir = src
include_dir = include
lib_dir = lib
build_dir = build/pio
core_dir = packages/platformio
libdeps_dir = packages/pio-libdeps

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 16MB
; Two 3 MB firmware slots and a LittleFS data partition (internal volume).
board_build.partitions = partitions-x4.csv
board_build.filesystem = littlefs

; gnu++2a: the dialect FreeInk is verified with on this toolchain.
build_flags =
  -std=gnu++2a
  -I include
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
build_unflags =
  -std=gnu++11

; First-party application sources only.
build_src_flags =
  -Wall -Wextra -Wpedantic -Wformat=2 -Wshadow
  -Wconversion -Wsign-conversion -Wnull-dereference

; Link libraries from archives, so only what a program uses is linked. The
; pioarduino platform turns this off unless it is set explicitly; without
; archives, Arduino's global WiFi object alone adds ~640 KB of flash and
; ~22 KB of RAM to every program. The loop stack override FreeInk relied
; on for that is set explicitly in lib/inkerface/src/x4/entry.cpp.
lib_archive = yes
lib_deps =
  ; Our platform layer. Listed explicitly: its public headers live in the
  ; project's include/, so the dependency finder cannot discover it.
  inkerface
  BoardConfig=symlink://packages/freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://packages/freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://packages/freeink-sdk/libs/hardware/InputManager
  XteinkDetect=symlink://packages/freeink-sdk/libs/hardware/XteinkDetect
  ; Card volume; pulls in SdFat as its dependency.
  SDCardManager=symlink://packages/freeink-sdk/libs/hardware/SDCardManager
  FreeInkUI=symlink://packages/freeink-sdk/libs/ui/FreeInkUI
  ; Sockets and HTTP. TLS stays off unless FREEINK_NET_WOLFSSL is defined
  ; and wolfSSL is added (GPLv2 or commercial licence; see the manual).
  SecureNet=symlink://packages/freeink-sdk/libs/network/SecureNet
  ; Deep sleep and wake on the power button, for power_off().
  PowerManager=symlink://packages/freeink-sdk/libs/hardware/PowerManager

; --- Xteink X4 only (tightest ESP32-C3 binary) --------------------------
[env:x4]
extends = base
board = esp32-c3-devkitm-1
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
